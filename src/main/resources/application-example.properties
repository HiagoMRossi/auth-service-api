spring.application.name=auth-service-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_service_api}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

jwt.secret=${JWT_SECRET:replace-with-a-secure-secret-at-least-32-characters-long}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
